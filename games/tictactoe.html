<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>井字棋 · Pro Max</title>
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0e11'/><path d='M9 9l6 6M15 9l-6 6' stroke='%2335e0c8' stroke-width='2.4'/><circle cx='22' cy='22' r='3.4' fill='none' stroke='%23ffb347' stroke-width='2.2'/></svg>">
<style>
:root{
  --bg:#0b0e11; --panel:#12171c; --line:#222b33; --ink:#e9eff5; --dim:#8b98a5;
  --accent:#35e0c8; --accent-2:#ffb347; --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background:radial-gradient(900px 600px at 50% -10%,rgba(53,224,200,.08),transparent 65%),var(--bg);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.bar{width:min(100%,460px); display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.back{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border:1px solid var(--line);
  border-radius:10px; color:var(--dim); text-decoration:none; font-size:13px; background:var(--panel);
  transition:color .18s,border-color .18s;
}
.back:hover{color:var(--ink); border-color:rgba(53,224,200,.4)}
.title{font-family:var(--mono); font-size:13px; letter-spacing:.18em; color:#6f7d8a; text-transform:uppercase; margin-left:auto; margin-right:6px}
button{
  font-family:inherit; font-size:13px; color:#c6d3de; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; padding:0 12px; cursor:pointer;
  transition:border-color .18s,color .18s; -webkit-tap-highlight-color:transparent;
}
button:hover{border-color:rgba(53,224,200,.45); color:var(--ink)}
button:focus-visible{outline:2px solid rgba(53,224,200,.55); outline-offset:2px}
.hud{width:min(100%,460px); display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin-bottom:12px}
.stat{
  flex:1 1 76px; min-width:0; padding:9px 13px; border:1px solid var(--line); border-radius:12px; background:var(--panel);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
.stat .label{font-size:11.5px; letter-spacing:.1em; color:#6f7d8a; white-space:nowrap}
.stat strong{font-family:var(--mono); font-size:21px; font-weight:600; font-variant-numeric:tabular-nums}
.stat.best strong{color:var(--accent-2)}
.stat.streak strong{color:var(--accent)}
.goal{
  width:min(100%,460px); margin:0 0 12px; padding:9px 13px;
  border-left:2px solid rgba(255,179,71,.5); background:rgba(18,23,28,.6);
  font-size:12.5px; color:#8b98a5; line-height:1.6;
}
.goal b{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent-2); margin-right:8px}

.status{
  width:min(100%,460px); min-height:34px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px; font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--dim);
  text-align:center; transition:color .2s;
}
.status.thinking{color:#7d8b98}
.status.win{color:var(--accent)}
.status.lose{color:#ff8a6b}
.status.draw{color:var(--accent-2)}

.board{
  position:relative;
  width:min(100%,460px); display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
  padding:11px; border:1px solid var(--line); border-radius:16px; background:#0f1419;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.board.shake{animation:bshake .3s ease-out}
@keyframes bshake{
  0%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}
  40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}
  80%{transform:translate(2px,0)}100%{transform:translate(0,0)}
}
.board.winflash{animation:wflash .8s ease-out}
@keyframes wflash{
  0%{box-shadow:0 0 0 0 rgba(53,224,200,0); border-color:var(--line)}
  35%{box-shadow:0 0 0 3px rgba(53,224,200,.6),0 0 40px rgba(53,224,200,.3); border-color:#7ff0dc}
  100%{box-shadow:0 0 0 0 rgba(53,224,200,0); border-color:var(--line)}
}
.cell{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:11px; background:#151c23; border:1px solid #1d262e;
  font-family:var(--mono); font-size:clamp(32px,10.5vw,42px); font-weight:600;
  cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background .12s,border-color .12s,transform .12s,color .12s;
}
.cell:hover{background:#1b232b}
.cell.x{color:var(--accent); cursor:default}
.cell.o{color:var(--accent-2); cursor:default}
.cell.x:hover,.cell.o:hover{background:#151c23}
.cell.win{background:rgba(53,224,200,.13); border-color:rgba(53,224,200,.5); box-shadow:0 0 18px rgba(53,224,200,.25)}
.cell.win.o-win{background:rgba(255,179,71,.13); border-color:rgba(255,179,71,.5); box-shadow:0 0 18px rgba(255,179,71,.25)}
.cell.pop{animation:pop .18s ease-out}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.cell.scan{background:#1e2b34; box-shadow:inset 0 0 0 1px rgba(53,224,200,.4)}
.fx{position:absolute; inset:0; pointer-events:none; z-index:2}

.result{
  width:min(100%,460px); margin-top:12px; padding:12px 14px; border:1px solid var(--line);
  border-radius:12px; background:var(--panel); display:flex; flex-direction:column; gap:6px;
  font-size:13px; color:var(--dim); line-height:1.5;
}
.result[hidden]{display:none!important}
.result.win{border-color:rgba(53,224,200,.45)}
.result.lose{border-color:rgba(255,120,90,.4)}
.result.draw{border-color:rgba(255,179,71,.35)}
.rankline{display:flex; align-items:baseline; gap:10px}
.rank{font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:.06em; line-height:1}
.rank.god{color:#ffd166; text-shadow:0 0 20px rgba(255,209,102,.55)}
.rank.inv{color:var(--accent)}
.rank.str{color:#9fd2ff}
.rank.sol{color:#c6d3de}
.rank.warm{color:#8b98a5}
.rank.cn{font-size:11.5px; letter-spacing:.12em; color:#6f7d8a}
.numline{font-family:var(--mono); font-size:12.5px; color:#b7c4cf}
.numline b{color:var(--ink); font-size:15px}
.tbl{font-family:var(--mono); font-size:11px; margin-top:2px}
.tbl .row{display:grid; grid-template-columns:20px 1fr 76px; gap:6px; align-items:baseline; padding:2px 4px; border-radius:6px; color:#7b8894}
.tbl .row.head{color:#556370; font-size:10px; letter-spacing:.08em}
.tbl .row.now{background:rgba(53,224,200,.12); color:#bff7ee}
.tbl .row i{font-style:normal; color:#556370}
.tbl .row span:nth-child(3){text-align:right}
.again{
  align-self:flex-start; padding:7px 14px; border-radius:9px; border:1px solid rgba(53,224,200,.4);
  background:transparent; color:var(--accent); font-family:var(--mono); font-size:12px; letter-spacing:.1em;
  cursor:pointer; transition:background .18s;
}
.again:hover{background:rgba(53,224,200,.1)}

.hint{width:min(100%,460px); margin:14px 0 0; color:#5c6772; font-size:12.5px; line-height:1.7; text-align:center}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation-duration:.01ms!important} }
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="../index.html">← 九个区</a><span class="zone-no" style="font:600 11px/1 var(--mono,monospace);letter-spacing:.16em;color:#5e6b77">09 / 09</span>
  <span class="title">Tic Tac Toe · Pro Max</span>
  <button id="soundBtn" type="button">音效 开</button>
</div>

<div class="hud">
  <div class="stat streak"><span class="label">连胜</span><strong id="streak">0</strong></div>
  <div class="stat best"><span class="label">最高连胜</span><strong id="best">—</strong></div>
  <div class="stat"><span class="label">手数</span><strong id="moves">0</strong></div>
</div>

<p class="goal"><b>目标</b>先连成三个。机器也在抢，先连成就赢；九格填满无人连成算平。它有两个固定的毛病：开局总想占最上面一排，而且每局必漏看你一次——第一次你造出威胁时它不堵。口子一定有，抓不抓得住看你。</p>

<div class="status" id="status">你先手，点一格落子。</div>

<div class="board" id="board" aria-label="井字棋盘">
  <canvas class="fx" id="fx"></canvas>
</div>

<div class="result" id="result" hidden>
  <div class="rankline"><span class="rank" id="resRank"></span><span class="rank cn" id="resCn"></span></div>
  <div class="numline" id="resNum"></div>
  <div class="tbl" id="resRuns"></div>
  <button class="again" id="again" type="button">下一局</button>
</div>

<p class="hint"><a href="../index.html" style="color:#35e0c8;text-decoration:none">← 回九个区看总账</a> · 你走 X，机器走 O。手数越少赢越狠。<kbd>R</kbd> 重开一局。</p>

<script>
(function () {
  'use strict';

  var boardEl = document.getElementById('board');
  var fx = document.getElementById('fx');
  var ctx = fx.getContext('2d');
  var statusEl = document.getElementById('status');
  var streakEl = document.getElementById('streak');
  var bestEl = document.getElementById('best');
  var movesEl = document.getElementById('moves');
  var resultEl = document.getElementById('result');
  var resRank = document.getElementById('resRank');
  var resCn = document.getElementById('resCn');
  var resNum = document.getElementById('resNum');
  var resRuns = document.getElementById('resRuns');
  var againEl = document.getElementById('again');
  var soundBtn = document.getElementById('soundBtn');

  var KEY_BEST = 'paly.tictactoe.best';
  var RUNS_KEY = 'paly.tictactoe.runs';
  var SOUND_KEY = 'paly.tictactoe.sound';
  var LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  var grid = [];
  var cells = [];
  var over = false;
  var busy = false;
  var streak = 0;
  var best = 0;
  var myMoves = 0;
  var t0 = 0;
  var thinkTimer = null;
  var PREF = [0, 1, 2];   // 它的偏好：最上面一排
  var slack = 0;          // 这一局它还剩几次"看漏"

  /* ---------- 音效 ---------- */
  var AC = null, soundOn = true;
  try { if (localStorage.getItem(SOUND_KEY) === '0') soundOn = false; } catch (e) {}
  function renderSoundBtn() { soundBtn.textContent = '音效 ' + (soundOn ? '开' : '关'); }
  renderSoundBtn();

  function ac() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, delay, glideTo) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) { try { o.frequency.exponentialRampToValueAtTime(glideTo, t + dur); } catch (e) {} }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(dur * 0.3, 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function sfxX() { tone(560, 0.08, 'square', 0.06, 0, 700); }
  function sfxO() { tone(340, 0.1, 'triangle', 0.06, 0, 260); }
  function sfxScan(i) { tone(400 + i * 26, 0.035, 'square', 0.022); }
  function sfxWin() {
    var notes = [523, 659, 784, 1046, 1318];
    for (var i = 0; i < notes.length; i++) tone(notes[i], 0.24, 'triangle', 0.1, i * 0.08);
  }
  function sfxLose() { tone(170, 0.4, 'sawtooth', 0.1, 0, 92); tone(110, 0.42, 'square', 0.06, 0.06, 62); }
  function sfxDraw() { tone(420, 0.18, 'sine', 0.07); tone(420, 0.16, 'sine', 0.05, 0.22); }
  function sfxBest() { tone(880, 0.14, 'sine', 0.1); tone(1320, 0.18, 'sine', 0.08, 0.12); }

  /* ---------- 粒子 ---------- */
  var dpr = window.devicePixelRatio || 1;
  var cw = 0, ch = 0, parts = [], raf = 0, lastT = 0;

  function sizeFx() {
    var r = boardEl.getBoundingClientRect();
    cw = r.width; ch = r.height;
    fx.width = Math.max(1, Math.round(cw * dpr));
    fx.height = Math.max(1, Math.round(ch * dpr));
    fx.style.width = cw + 'px';
    fx.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function cellCenter(i) {
    var el = cells[i];
    return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
  }

  function burst(x, y, n, aCol, bCol, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (power || 36) + Math.random() * (power || 36);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: 0, ttl: 0.4 + Math.random() * 0.36,
        size: 1.5 + Math.random() * 2.3,
        c: Math.random() < 0.62 ? aCol : bCol
      });
    }
    if (parts.length > 200) parts.splice(0, parts.length - 200);
    if (!raf) { lastT = 0; raf = requestAnimationFrame(paint); }
  }

  function paint(ts) {
    if (!lastT) lastT = ts;
    var dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    ctx.clearRect(0, 0, cw, ch);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life += dt;
      if (p.life >= p.ttl) { parts.splice(i, 1); continue; }
      p.vy += 140 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var k = 1 - p.life / p.ttl;
      ctx.globalAlpha = Math.max(0, k * k);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + k * 0.7), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(paint);
    else { raf = 0; ctx.clearRect(0, 0, cw, ch); }
  }

  function shakeBoard() {
    boardEl.classList.remove('shake');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake');
  }

  /* ---------- 记录 ---------- */
  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(KEY_BEST), 10);
      best = isFinite(v) && v > 0 ? v : 0;
    } catch (e) { best = 0; }
  }

  function saveBest() {
    try { localStorage.setItem(KEY_BEST, String(best)); } catch (e) {}
  }

  function renderHead() {
    bestEl.textContent = best > 0 ? best + ' 场' : '—';
    streakEl.textContent = String(streak);
  }

  // 榜记"赢一局用了几手"，越少越狠
  function readRuns() {
    try {
      var raw = localStorage.getItem(RUNS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (x) { return x && typeof x.m === 'number'; })
                .sort(function (a, b) { return a.m - b.m; })
                .slice(0, 5);
    } catch (e) { return []; }
  }

  function pushRun(run) {
    var list = readRuns();
    list.push(run);
    list.sort(function (a, b) { return a.m - b.m; });
    list = list.slice(0, 5);
    try { localStorage.setItem(RUNS_KEY, JSON.stringify(list)); } catch (e) {}
    return list;
  }

  function rankOf(kind, moves) {
    if (kind === 'win') {
      if (moves <= 3) return { k: 'god', n: 'GODLIKE', cn: '最少手数赢' };
      if (moves === 4) return { k: 'inv', n: 'INVINCIBLE', cn: '四手封盘' };
      if (moves === 5) return { k: 'str', n: 'STRONG', cn: '五手拿下' };
      return { k: 'sol', n: 'SOLID', cn: '磨到你赢' };
    }
    if (kind === 'draw') return { k: 'sol', n: 'SOLID', cn: '打不垮' };
    return { k: 'warm', n: 'WARMUP', cn: '被连成三个' };
  }

  function renderRuns(list, runId) {
    if (!list.length) { resRuns.innerHTML = ''; return; }
    var html = '<div class="row head"><i>#</i><span>赢法</span><span>评级</span></div>';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      html += '<div class="row' + (runId && r.id === runId ? ' now' : '') + '">' +
        '<i>' + (i + 1) + '</i><span>' + r.m + ' 手</span>' +
        '<span>' + rankOf('win', r.m).n + '</span></div>';
    }
    resRuns.innerHTML = html;
  }

  /* ---------- 棋盘 ---------- */
  function buildBoard() {
    // 保留 canvas，其余清掉重建
    while (boardEl.children.length > 1) boardEl.removeChild(boardEl.lastChild);
    cells = [];
    for (var i = 0; i < 9; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.setAttribute('data-i', String(i));
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 格');
      boardEl.appendChild(b);
      cells.push(b);
    }
    sizeFx();
  }

  function paintCell(popAt) {
    for (var i = 0; i < 9; i++) {
      var el = cells[i];
      var v = grid[i];
      el.textContent = v || '';
      el.className = 'cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      if (popAt === i) {
        void el.offsetWidth;
        el.classList.add('pop');
      }
    }
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function winnerOf(g) {
    for (var k = 0; k < LINES.length; k++) {
      var L = LINES[k];
      var a = g[L[0]], b = g[L[1]], c = g[L[2]];
      if (a && a === b && b === c) return { who: a, line: L };
    }
    return null;
  }

  function isFull(g) {
    for (var i = 0; i < 9; i++) if (!g[i]) return false;
    return true;
  }

  // 机器：一个有脾气的人，不是完美防守机器。
  // ① 自己能连成三个 → 立刻连（它不会放过杀你的机会）
  // ② 你只差一格就赢 → 它通常会堵，但这一局它有 slack 次会看漏（人会漏）
  // ③ 没有威胁时，它偏爱最上面一排 —— 这是你能读出来的固定路子
  // ④ 否则中心、角、边
  function machineMove() {
    var i;
    for (i = 0; i < 9; i++) {
      if (grid[i]) continue;
      grid[i] = 'O';
      if (winnerOf(grid)) { grid[i] = ''; return i; }
      grid[i] = '';
    }
    var blockAt = -1;
    for (i = 0; i < 9; i++) {
      if (grid[i]) continue;
      grid[i] = 'X';
      if (winnerOf(grid)) { grid[i] = ''; blockAt = i; break; }
      grid[i] = '';
    }
    if (blockAt >= 0) {
      if (slack > 0) {
        slack -= 1;            // 这一局它一定会漏一次，不多不少
      } else {
        return blockAt;
      }
    }
    for (i = 0; i < PREF.length; i++) {
      if (!grid[PREF[i]]) return PREF[i];
    }
    if (!grid[4]) return 4;
    var corners = [], cs = [0, 2, 6, 8];
    for (i = 0; i < cs.length; i++) if (!grid[cs[i]]) corners.push(cs[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    var edges = [], es = [1, 3, 5, 7];
    for (i = 0; i < es.length; i++) if (!grid[es[i]]) edges.push(es[i]);
    if (edges.length) return edges[Math.floor(Math.random() * edges.length)];
    return -1;
  }

  function markWin(line, who) {
    for (var i = 0; i < line.length; i++) {
      var el = cells[line[i]];
      el.classList.add('win');
      if (who === 'O') el.classList.add('o-win');
    }
    for (var k = 0; k < line.length; k++) {
      (function (idx, delay) {
        setTimeout(function () {
          var p = cellCenter(idx);
          burst(p.x, p.y, 12, who === 'X' ? '#7ff0dc' : '#ff8a6b', who === 'X' ? '#ffd166' : '#c96a5e', 44);
        }, delay);
      })(line[k], k * 90);
    }
  }

  function showResult(kind) {
    var ms = Math.max(1, Math.round(performance.now() - t0));
    var rk = rankOf(kind, myMoves);
    resultEl.hidden = false;
    resultEl.className = 'result ' + kind;
    resRank.className = 'rank ' + rk.k;
    resRank.textContent = rk.n;
    resCn.textContent = rk.cn;

    var head;
    if (kind === 'win') head = '你赢 · <b>' + myMoves + '</b> 手 · ' + (ms / 1000).toFixed(1) + 's';
    else if (kind === 'draw') head = '平局 · 九格填满 · ' + (ms / 1000).toFixed(1) + 's';
    else head = '输了 · 机器连成三个 · ' + (ms / 1000).toFixed(1) + 's';
    resNum.innerHTML = head + ' · 连胜 <b>' + streak + '</b>';
    // 下次目标：给一个具体数字
    var oldGoal = document.getElementById('ttt-goal');
    if (oldGoal) oldGoal.parentNode.removeChild(oldGoal);
    (function () {
      var bestM = 0;
      try {
        var rs = JSON.parse(localStorage.getItem(RUNS_KEY) || '[]');
        (Array.isArray(rs) ? rs : []).forEach(function (r) {
          if (r && typeof r.m === 'number' && r.m > 0 && (!bestM || r.m < bestM)) bestM = r.m;
        });
      } catch (e) { bestM = 0; }
      var g = document.createElement('div');
      g.id = 'ttt-goal';
      g.style.cssText = 'margin-top:8px;font:600 12px/1.6 var(--mono,monospace);color:#35e0c8';
      if (kind !== 'win') g.textContent = '它每局必漏一次——下一次抓它漏的那一步。';
      else if (!bestM || myMoves < bestM) g.textContent = '新纪录立住了——下一局守它。';
      else if (myMoves === bestM) g.textContent = '手数追平最好，下回试着少一手。';
      else g.textContent = '距你的最好（' + bestM + ' 手）还差 ' + (myMoves - bestM) + ' 手。';
      resNum.parentNode.insertBefore(g, resNum.nextSibling);
    })();

    if (kind === 'win') {
      var run = { m: myMoves, at: Date.now(), id: Date.now() + '-' + Math.random().toString(36).slice(2, 8) };
      renderRuns(pushRun(run), run.id);
    } else {
      renderRuns(readRuns(), null);
    }
  }

  function finish(kind, result) {
    over = true;
    busy = false;
    if (thinkTimer) { clearTimeout(thinkTimer); thinkTimer = null; }

    if (kind === 'win') {
      streak += 1;
      var wasBest = streak > best;
      if (wasBest) { best = streak; saveBest(); }
      renderHead();
      markWin(result.line, 'X');
      setStatus('你赢了 · 三连线' + (streak > 1 ? ' · 连胜 ' + streak : ''), 'win');
      sfxWin();
      if (wasBest) setTimeout(sfxBest, 340);
      boardEl.classList.remove('winflash');
      void boardEl.offsetWidth;
      boardEl.classList.add('winflash');
      for (var q = 0; q < 9; q++) {
        (function (idx) {
          setTimeout(function () {
            var p = cellCenter(idx);
            burst(p.x, p.y, 6, '#7ff0dc', '#ffd166', 34);
          }, 260 + Math.random() * 380);
        })(q);
      }
    } else if (kind === 'lose') {
      streak = 0;
      renderHead();
      markWin(result.line, 'O');
      setStatus('机器连成三个，这局你输了。', 'lose');
      sfxLose();
      shakeBoard();
    } else {
      streak = 0;
      renderHead();
      setStatus('九格填满，平局。', 'draw');
      sfxDraw();
    }
    showResult(kind);
  }

  function machineTurn() {
    thinkTimer = null;
    if (over) return;
    var m = machineMove();
    if (m >= 0) {
      grid[m] = 'O';
      paintCell(m);
      sfxO();
      var p = cellCenter(m);
      burst(p.x, p.y, 8, '#ffb347', '#ffd166', 30);
      var res = winnerOf(grid);
      if (res) { finish('lose', res); return; }
      if (isFull(grid)) { finish('draw'); return; }
    }
    busy = false;
    setStatus('轮到你了。');
  }

  function play(i) {
    if (over || busy || grid[i]) return;
    grid[i] = 'X';
    myMoves += 1;
    movesEl.textContent = String(myMoves);
    paintCell(i);
    sfxX();
    var p = cellCenter(i);
    burst(p.x, p.y, 9, '#7ff0dc', '#8fb7c9', 32);

    var res = winnerOf(grid);
    if (res) { finish('win', res); return; }
    if (isFull(grid)) { finish('draw'); return; }

    busy = true;
    setStatus('机器在想…', 'thinking');
    thinkTimer = setTimeout(machineTurn, 420);
  }

  function startNew() {
    if (thinkTimer) { clearTimeout(thinkTimer); thinkTimer = null; }
    grid = ['', '', '', '', '', '', '', '', ''];
    over = false;
    busy = true;
    myMoves = 0;
    parts = [];
    slack = 1;   // 每局它必漏一次，口子一定有，抓不抓得住看人
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    ctx.clearRect(0, 0, cw, ch);
    movesEl.textContent = '0';
    resultEl.hidden = true;
    paintCell(-1);
    setStatus('开局，看清格子', 'thinking');
    t0 = performance.now();

    // 开场仪式：九格逐格扫亮，扫完才交给你
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        setTimeout(function () {
          if (!cells[idx]) return;
          cells[idx].classList.add('scan');
          sfxScan(idx);
          setTimeout(function () { if (cells[idx]) cells[idx].classList.remove('scan'); }, 130);
        }, idx * 48);
      })(i);
    }
    setTimeout(function () {
      busy = false;
      setStatus('你先手，点一格落子。');
    }, 9 * 48 + 140);
  }

  boardEl.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.cell') : null;
    if (!t || !boardEl.contains(t)) return;
    play(parseInt(t.getAttribute('data-i'), 10));
  });

  againEl.addEventListener('click', startNew);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') startNew();
  });
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    renderSoundBtn();
    try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
    if (soundOn) tone(720, 0.1, 'triangle', 0.06);
  });
  window.addEventListener('resize', sizeFx);

  loadBest();
  renderHead();
  buildBoard();
  startNew();
})();
</script>
<script src="../assets/pulse.js" defer></script>
</body>
</html>
