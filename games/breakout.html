<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打砖块 · Pro Max</title>
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0e11'/><rect x='6' y='8' width='20' height='5' rx='2' fill='%2335e0c8'/><circle cx='16' cy='24' r='3' fill='%23ffb347'/></svg>">
<style>
:root{
  --bg:#0b0e11; --panel:#12171c; --line:#222b33; --ink:#e9eff5; --dim:#8b98a5;
  --accent:#35e0c8; --accent-2:#ffb347; --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%; background:radial-gradient(900px 600px at 50% -10%,rgba(53,224,200,.08),transparent 65%),var(--bg);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.bar{width:min(100%,460px); display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.back{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border:1px solid var(--line);
  border-radius:10px; color:var(--dim); text-decoration:none; font-size:13px; background:var(--panel);
  transition:color .18s,border-color .18s;
}
.back:hover{color:var(--ink); border-color:rgba(53,224,200,.4)}
.title{font-family:var(--mono); font-size:13px; letter-spacing:.18em; color:#6f7d8a; text-transform:uppercase; margin-left:auto; margin-right:6px}
.hud{width:min(100%,460px); display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin-bottom:12px}
.stat{
  flex:1 1 80px; min-width:0; padding:9px 13px; border:1px solid var(--line); border-radius:12px; background:var(--panel);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
.stat .label{font-size:11.5px; letter-spacing:.1em; color:#6f7d8a; white-space:nowrap}
.stat strong{font-family:var(--mono); font-size:20px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.stat.best strong{color:var(--accent-2)}
.btns{display:flex; gap:8px}
button{
  font-family:inherit; font-size:13px; color:#c6d3de; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; padding:0 12px; cursor:pointer;
  transition:border-color .18s,color .18s,background .18s;
  -webkit-tap-highlight-color:transparent;
}
button:hover{border-color:rgba(53,224,200,.45); color:var(--ink)}
button:focus-visible{outline:2px solid rgba(53,224,200,.55); outline-offset:2px}
button.primary{background:rgba(53,224,200,.12); border-color:rgba(53,224,200,.45); color:#d7fff9}
.stage{position:relative; width:min(100%,460px); aspect-ratio:1; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#0e1317}
canvas{display:block; width:100%; height:100%; touch-action:none}
.overlay{
  position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  padding:20px; text-align:center; background:rgba(8,11,14,.9); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
}
.overlay.show{display:flex}
.rank{font-family:var(--mono); font-size:clamp(22px,7vw,32px); font-weight:700; letter-spacing:.06em; line-height:1}
.rank.god{color:#ffd166; text-shadow:0 0 26px rgba(255,209,102,.6)}
.rank.inv{color:var(--accent); text-shadow:0 0 20px rgba(53,224,200,.45)}
.rank.str{color:#9fd2ff}
.rank.sol{color:#c6d3de}
.rank.warm{color:#8b98a5}
.rankcn{font-size:11.5px; letter-spacing:.14em; color:#6f7d8a}
.overlay h2{margin:2px 0 0; font-size:clamp(18px,5vw,24px); font-weight:650}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; margin-top:6px}
.grid3 div{background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:9px; padding:7px 4px}
.grid3 span{display:block; font-size:10.5px; letter-spacing:.08em; color:#6f7d8a}
.grid3 b{display:block; font-family:var(--mono); font-size:16px; margin-top:3px; color:#dfe9f2}
.tbl{width:100%; margin-top:4px; font-family:var(--mono); font-size:11px}
.tbl .row{display:grid; grid-template-columns:20px 1fr 84px; gap:6px; align-items:baseline; padding:3px 6px; border-radius:6px; color:#7b8894}
.tbl .row.head{color:#556370; font-size:10px; letter-spacing:.08em}
.tbl .row.now{background:rgba(53,224,200,.12); color:#bff7ee}
.tbl .row i{font-style:normal; color:#556370}
.tbl .row span:nth-child(3){text-align:right}
.overlay button{height:38px; margin-top:6px; background:rgba(53,224,200,.14); border-color:rgba(53,224,200,.5); color:#d7fff9}
.goal{
  width:min(100%,460px); margin:0 0 12px; padding:9px 13px;
  border-left:2px solid rgba(53,224,200,.5); background:rgba(18,23,28,.6);
  font-size:12.5px; color:#8b98a5; line-height:1.6;
}
.goal b{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); margin-right:8px}
.hint{width:min(100%,460px); margin:14px 0 0; color:#5c6772; font-size:12.5px; line-height:1.7; text-align:center}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="../index.html">← 九个区</a><span class="zone-no" style="font:600 11px/1 var(--mono,monospace);letter-spacing:.16em;color:#5e6b77">04 / 09</span>
  <span class="title">Breakout · Pro Max</span>
  <button id="soundBtn" type="button">音效 开</button>
</div>

<div class="hud">
  <div class="stat"><span class="label">得分</span><strong id="score">0</strong></div>
  <div class="stat"><span class="label">命</span><strong id="lives">3</strong></div>
  <div class="stat best"><span class="label">最高</span><strong id="best">0</strong></div>
  <div class="btns">
    <button id="pauseBtn" type="button">开始</button>
    <button id="restartBtn" type="button">重开</button>
  </div>
</div>

<p class="goal"><b>目标</b>拍子接球消砖。球落地扣一条命，三条用完给评级。同一颗球连续消砖会攒链：第 8 块起每块 ×2，第 16 块起 ×3，漏球即断。等级看层数，连击只加分数和手感——想让链活久一点，就别急着把球打回拍面正中央。</p>

<div class="stage" id="stage">
  <canvas id="board"></canvas>
  <div class="overlay" id="overlay">
    <div class="rank" id="ovRank"></div>
    <div class="rankcn" id="ovRankCn"></div>
    <h2 id="ovTitle">打砖块</h2>
    <div class="grid3" id="ovStats"></div>
    <div class="tbl" id="ovRuns"></div>
    <button class="primary" id="ovBtn" type="button">开始游戏</button>
  </div>
</div>

<p class="hint"><a href="../index.html" style="color:#35e0c8;text-decoration:none">← 回九个区看总账</a> · 鼠标 / 手指拖动，或 ← → 键移动拍子。空格暂停。</p>

<script>
(function () {
  'use strict';

  var W = 460, H = 460;
  var PADDLE_W = 92, PADDLE_H = 12, PADDLE_Y = H - 34;
  var BALL_R = 7;
  var BASE_SPEED = 0.40;      // px / ms
  var SPEED_STEP = 0.05;
  var SPEED_MAX = 0.78;
  var ROWS = 4, COLS = 8;
  var PAD_X = 10, GAP = 6, BRICK_H = 22, TOP_Y = 68;
  var BEST_KEY = 'paly.breakout.best';
  var RUNS_KEY = 'paly.breakout.runs';
  var SOUND_KEY = 'paly.breakout.sound';
  var CD_MS = 520;

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovRank = document.getElementById('ovRank');
  var ovRankCn = document.getElementById('ovRankCn');
  var ovTitle = document.getElementById('ovTitle');
  var ovStats = document.getElementById('ovStats');
  var ovRuns = document.getElementById('ovRuns');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');
  var soundBtn = document.getElementById('soundBtn');

  var state = 'ready';        // ready | countdown | playing | paused | over
  var bricks = [];
  var ball = { x: W / 2, y: PADDLE_Y - 40, vx: 0, vy: 0 };
  var trail = [];             // 球的残影位置
  var paddleX = W / 2;
  var score = 0, best = 0, lives = 3, level = 1;
  var chain = 0, mult = 1;    // 连击链：同一颗球连续消砖，漏球即断
  var speed = BASE_SPEED;
  var lastTs = 0, rafId = 0;
  var keys = { left: false, right: false };
  var cdStart = 0, cdShown = -1;
  var paddleGlow = 0, boardFlash = 0, boardFlashColor = '53,224,200';
  var shake = 0;
  var parts = [], floats = [];

  /* ---------- 音效 ---------- */
  var AC = null, soundOn = true;
  try { if (localStorage.getItem(SOUND_KEY) === '0') soundOn = false; } catch (e) {}
  function renderSoundBtn() { soundBtn.textContent = '音效 ' + (soundOn ? '开' : '关'); }
  renderSoundBtn();

  function ac() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, delay, glideTo) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) { try { o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur); } catch (e) {} }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(dur * 0.3, 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function sfxCd(n) { tone(420 + (3 - n) * 80, 0.09, 'square', 0.055); }
  function sfxGo() { tone(900, 0.12, 'triangle', 0.09); tone(1220, 0.14, 'triangle', 0.07, 0.06); }
  function sfxPaddle() { tone(230, 0.07, 'square', 0.06, 0, 300); }
  function sfxBrick(row) { tone(420 + (3 - row) * 95, 0.08, 'triangle', 0.08); }
  function sfxLife() { tone(200, 0.3, 'sawtooth', 0.09, 0, 90); }
  // 连击升档：两声不同高低的确认音 + 一次震屏，让"这条链还在"听得见
  function sfxChain(m, n) {
    tone(620 + m * 110, 0.11, 'triangle', 0.07);
    tone(920 + m * 150, 0.13, 'sine', 0.055, 0.09);
    shake = Math.max(shake, 3.4);
    addFloat(W / 2, H * 0.42, 'CHAIN ×' + m, '#ffd166');
  }
  function sfxLevel() {
    var notes = [523, 698, 880, 1174];
    for (var i = 0; i < notes.length; i++) tone(notes[i], 0.22, 'triangle', 0.1, i * 0.08);
  }
  function sfxOver() { tone(190, 0.5, 'sawtooth', 0.09, 0, 100); tone(95, 0.5, 'sine', 0.08, 0.1, 55); }
  function sfxBest() { tone(880, 0.14, 'sine', 0.1); tone(1320, 0.18, 'sine', 0.08, 0.12); }

  /* ---------- 记录 ---------- */
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function readRuns() {
    try {
      var raw = localStorage.getItem(RUNS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (x) { return x && typeof x.s === 'number'; })
                .sort(function (a, b) { return b.s - a.s; })
                .slice(0, 5);
    } catch (e) { return []; }
  }

  function pushRun(run) {
    var list = readRuns();
    list.push(run);
    list.sort(function (a, b) { return b.s - a.s; });
    list = list.slice(0, 5);
    try { localStorage.setItem(RUNS_KEY, JSON.stringify(list)); } catch (e) {}
    return list;
  }

  function rankOf(sc, lv) {
    if (lv >= 4 || sc >= 800) return { k: 'god', n: 'GODLIKE', cn: '神级手感' };
    if (lv >= 3) return { k: 'inv', n: 'INVINCIBLE', cn: '拍子不丢球' };
    if (lv >= 2) return { k: 'str', n: 'STRONG', cn: '有硬实力' };
    if (sc >= 150) return { k: 'sol', n: 'SOLID', cn: '稳得住' };
    return { k: 'warm', n: 'WARMUP', cn: '热身而已' };
  }

  /* ---------- 粒子与浮字 ---------- */
  function shatter(b) {
    var col = COLORS[b.row % COLORS.length][0];
    var n = 12;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 130;
      parts.push({
        x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0, ttl: 0.4 + Math.random() * 0.4,
        size: 2 + Math.random() * 3, c: col
      });
    }
    if (parts.length > 320) parts.splice(0, parts.length - 320);
  }

  function addFloat(x, y, text, color) {
    floats.push({ x: x, y: y, text: text, c: color, life: 0, ttl: 0.75 });
    if (floats.length > 24) floats.shift();
  }

  function stepFx(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life += dt;
      if (p.life >= p.ttl) { parts.splice(i, 1); continue; }
      p.vy += 180 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (var j = floats.length - 1; j >= 0; j--) {
      var f = floats[j];
      f.life += dt;
      if (f.life >= f.ttl) floats.splice(j, 1);
    }
  }

  var COLORS = [
    ['#ffb347', 'rgba(255,179,71,.16)'],
    ['#35e0c8', 'rgba(53,224,200,.14)'],
    ['#7ef0dd', 'rgba(126,240,221,.12)'],
    ['#6f9fbd', 'rgba(111,159,189,.14)']
  ];

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    draw();
  }

  function layoutBricks() {
    var bw = (W - PAD_X * 2 - GAP * (COLS - 1)) / COLS;
    bricks = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: PAD_X + c * (bw + GAP),
          y: TOP_Y + r * (BRICK_H + GAP),
          w: bw,
          h: BRICK_H,
          row: r,
          alive: true,
          glow: 0
        });
      }
    }
  }

  function resetBall() {
    ball.x = paddleX;
    ball.y = PADDLE_Y - 26;
    var ang = (Math.random() * 0.5 + 0.28) * (Math.random() < 0.5 ? -1 : 1);
    ball.vx = Math.sin(ang) * speed;
    ball.vy = -Math.cos(ang) * speed;
    trail = [];
  }

  function reset() {
    layoutBricks();
    score = 0; lives = 3; level = 1;
    chain = 0; mult = 1;
    speed = BASE_SPEED;
    paddleX = W / 2;
    scoreEl.textContent = '0';
    livesEl.textContent = '3';
    resetBall();
    parts = [];
    floats = [];
    shake = 0;
    state = 'ready';
    draw();
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0.4) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    ctx.clearRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#0e1317';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 极淡的网格底纹
    ctx.strokeStyle = 'rgba(34,43,51,.5)';
    ctx.lineWidth = 1;
    for (var gx = 0; gx <= W; gx += 46) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (var gy = 0; gy <= H; gy += 46) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    // 砖
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var col = COLORS[b.row % COLORS.length];
      ctx.fillStyle = col[1];
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      ctx.strokeStyle = col[0];
      ctx.globalAlpha = b.glow > 0 ? 1 : 0.75;
      ctx.lineWidth = b.glow > 0 ? 2 : 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (b.glow > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (b.glow * 0.5) + ')';
        roundRect(b.x, b.y, b.w, b.h, 5);
        ctx.fill();
      }
    }

    // 球拖尾
    for (var t = 0; t < trail.length; t++) {
      var tp = trail[t];
      var age = 1 - t / trail.length;
      ctx.globalAlpha = age * 0.22;
      ctx.fillStyle = '#bfeee6';
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, BALL_R * (0.4 + age * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 拍子（受击时发亮）
    var px = paddleX - PADDLE_W / 2;
    ctx.fillStyle = 'rgba(53,224,200,' + (0.16 + paddleGlow * 0.5) + ')';
    roundRect(px - 4, PADDLE_Y - 3, PADDLE_W + 8, PADDLE_H + 6, 8);
    ctx.fill();
    ctx.fillStyle = '#35e0c8';
    roundRect(px, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
    ctx.fill();

    // 球
    ctx.shadowColor = 'rgba(233,239,245,.55)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#e9eff5';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // 粒子
    for (var k = 0; k < parts.length; k++) {
      var p = parts[k];
      var kk = 1 - p.life / p.ttl;
      ctx.globalAlpha = Math.max(0, kk);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // 浮字
    ctx.font = '600 13px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'center';
    for (var m = 0; m < floats.length; m++) {
      var f = floats[m];
      var ff = 1 - f.life / f.ttl;
      ctx.globalAlpha = Math.min(1, ff * 1.5);
      ctx.fillStyle = f.c;
      ctx.fillText(f.text, f.x, f.y - (1 - ff) * 28);
    }
    ctx.globalAlpha = 1;

    // HUD 上的层数
    ctx.font = '600 12px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(111,125,138,.9)';
    ctx.fillText('LEVEL ' + level, PAD_X, 34);

    // 连击：同一颗球连续消砖，越连越值钱。漏球就断链。
    if (chain > 0) {
      ctx.textAlign = 'right';
      ctx.font = '700 13px ui-monospace,Consolas,monospace';
      ctx.fillStyle = mult > 1 ? 'rgba(255,209,102,.95)' : 'rgba(111,125,138,.75)';
      ctx.fillText((mult > 1 ? '×' + mult + '  ' : '') + 'CHAIN ' + chain, W - PAD_X, 34);
      ctx.textAlign = 'left';
    }

    // 倒计时大字
    if (state === 'ready') {
      ctx.textAlign = 'center';
      ctx.font = '600 15px ui-monospace,Consolas,monospace';
      ctx.fillStyle = 'rgba(53,224,200,.7)';
      ctx.fillText('点「开始」或按空格', W / 2, H * 0.55);
    }

    if (state === 'countdown') {
      var idx = Math.min(3, Math.floor((performance.now() - cdStart) / CD_MS));
      var label = idx >= 3 ? 'GO' : String(3 - idx);
      ctx.textAlign = 'center';
      ctx.font = '700 ' + (idx >= 3 ? 64 : 78) + 'px ui-monospace,Consolas,monospace';
      ctx.fillStyle = idx >= 3 ? 'rgba(53,224,200,.9)' : 'rgba(255,209,102,.85)';
      ctx.fillText(label, W / 2, H * 0.56);
    }

    // 闪屏
    if (boardFlash > 0) {
      ctx.fillStyle = 'rgba(' + boardFlashColor + ',' + (boardFlash * 0.35) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    ctx.restore();
  }

  function hitBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + BALL_R <= b.x || ball.x - BALL_R >= b.x + b.w) continue;
      if (ball.y + BALL_R <= b.y || ball.y - BALL_R >= b.y + b.h) continue;

      b.alive = false;
      b.glow = 0;

      // 连击：第 8 块起 ×2，第 16 块起 ×3。链只在一颗球上累计，漏球清零。
      chain += 1;
      var nmult = chain >= 16 ? 3 : (chain >= 8 ? 2 : 1);
      if (nmult !== mult) { mult = nmult; sfxChain(mult, chain); }
      var gain = 10 * mult;
      score += gain;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }

      shatter(b);
      addFloat(b.x + b.w / 2, b.y + b.h / 2, '+' + gain + (mult > 1 ? ' ×' + mult : ''), mult > 1 ? '#ffd166' : COLORS[b.row % COLORS.length][0]);
      sfxBrick(b.row);
      shake = Math.max(shake, 2.4);

      // 按穿透深度判定从哪一侧弹回，并把球推回砖外，避免卡在砖里连消
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      var ox = (BALL_R + b.w / 2) - Math.abs(ball.x - cx);
      var oy = (BALL_R + b.h / 2) - Math.abs(ball.y - cy);
      if (ox < oy) {
        ball.vx = -ball.vx;
        ball.x += (ball.x < cx ? -ox : ox);
      } else {
        ball.vy = -ball.vy;
        ball.y += (ball.y < cy ? -oy : oy);
      }
      return true;
    }
    return false;
  }

  function stepPhysics(step) {
    // 键盘推动拍子
    if (keys.left) paddleX -= 0.6 * step;
    if (keys.right) paddleX += 0.6 * step;
    paddleX = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, paddleX));

    ball.x += ball.vx * step;
    ball.y += ball.vy * step;

    // 左右墙
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    // 顶墙
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    hitBricks();

    // 拍子
    if (ball.vy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H + 6) {
      if (ball.x >= paddleX - PADDLE_W / 2 - BALL_R && ball.x <= paddleX + PADDLE_W / 2 + BALL_R) {
        ball.y = PADDLE_Y - BALL_R;
        var hit = (ball.x - paddleX) / (PADDLE_W / 2);
        hit = Math.max(-1, Math.min(1, hit));
        var angle = hit * 0.95;                       // 最多偏 54 度
        var sp = Math.max(speed, Math.min(SPEED_MAX, Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy)));
        ball.vx = Math.sin(angle) * sp;
        ball.vy = -Math.cos(angle) * sp;
        ball.vx = Math.max(-0.62, Math.min(0.62, ball.vx));
        paddleGlow = 1;
        sfxPaddle();
        addFloat(ball.x, PADDLE_Y - 8, 'PADDLE', 'rgba(53,224,200,.9)');
      }
    }

    // 漏球
    if (ball.y - BALL_R > H) {
      chain = 0; mult = 1;          // 漏球 = 链断，回到 ×1
      lives -= 1;
      livesEl.textContent = lives;
      sfxLife();
      shake = 7;
      boardFlash = 1;
      boardFlashColor = '255,90,60';
      if (lives <= 0) { gameOver(); return; }
      paddleX = W / 2;
      resetBall();
      lastTs = 0;
      return;
    }

    // 清层
    if (bricks.every(function (b) { return !b.alive; })) {
      chain = 0; mult = 1;        // 换层换球，链从 ×1 重新起
      score += 50;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      level += 1;
      speed = Math.min(SPEED_MAX, speed + SPEED_STEP);
      layoutBricks();
      paddleX = W / 2;
      resetBall();
      lastTs = 0;
      sfxLevel();
      boardFlash = 1;
      boardFlashColor = '53,224,200';
      shake = 4;
      addFloat(W / 2, H / 2, 'LEVEL ' + level, '#7ff0dc');
    }
  }

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (state !== 'playing' && state !== 'countdown') { lastTs = ts; draw(); return; }
    if (!lastTs) lastTs = ts;
    var dt = Math.min(ts - lastTs, 34);
    lastTs = ts;

    // 衰减类反馈
    paddleGlow = Math.max(0, paddleGlow - dt / 220);
    boardFlash = Math.max(0, boardFlash - dt / 340);
    shake = Math.max(0, shake - dt / 60);
    stepFx(dt / 1000);
    for (var bi = 0; bi < bricks.length; bi++) {
      if (bricks[bi].glow > 0) bricks[bi].glow = Math.max(0, bricks[bi].glow - dt / 300);
    }

    if (state === 'countdown') {
      var idx = Math.floor((ts - cdStart) / CD_MS);
      if (idx > 3) {
        state = 'playing';
        resetBall();
        sfxGo();
        boardFlash = 1;
        boardFlashColor = '53,224,200';
      } else if (idx !== cdShown) {
        cdShown = idx;
        if (idx < 3) sfxCd(idx);
      }
      draw();
      return;
    }

    // 拆成不超过 8px 的小步，避免高速穿透
    var maxV = Math.max(Math.abs(ball.vx), Math.abs(ball.vy));
    var steps = maxV > 0 ? Math.ceil((maxV * dt) / 8) : 1;
    steps = Math.min(steps, 10);
    var sub = dt / steps;
    for (var i = 0; i < steps && state === 'playing'; i++) {
      stepPhysics(sub);
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 6) trail.shift();
    }

    draw();
  }

  function showOverlay(title, btnText) {
    ovTitle.textContent = title;
    ovBtn.textContent = btnText;
    overlay.classList.add('show');
  }

  function hideOverlay() { overlay.classList.remove('show'); }

  function startCd() {
    reset();
    state = 'countdown';
    cdStart = performance.now();
    cdShown = -1;
    pauseBtn.textContent = '暂停';
    hideOverlay();
    lastTs = 0;
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      pauseBtn.textContent = '继续';
      ovRank.className = 'rank sol';
      ovRank.textContent = 'PAUSED';
      ovRankCn.textContent = '已暂停';
      ovTitle.textContent = '按空格继续';
      ovStats.innerHTML = '';
      ovRuns.innerHTML = '';
      ovBtn.textContent = '继续';
      overlay.classList.add('show');
    } else if (state === 'paused') {
      state = 'playing';
      pauseBtn.textContent = '暂停';
      lastTs = 0;
      hideOverlay();
    } else {
      startCd();
    }
  }

  function renderRuns(list, runId) {
    var html = '<div class="row head"><i>#</i><span>得分</span><span>层数</span></div>';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      html += '<div class="row' + (runId && r.id === runId ? ' now' : '') + '">' +
        '<i>' + (i + 1) + '</i><span>' + r.s + '</span>' +
        '<span>' + r.lv + ' 层</span></div>';
    }
    ovRuns.innerHTML = html;
  }

  function gameOver() {
    state = 'over';
    pauseBtn.textContent = '再来一局';
    var run = { s: score, lv: level, at: Date.now(), id: Date.now() + '-' + Math.random().toString(36).slice(2, 8) };
    var list = pushRun(run);
    var rk = rankOf(score, level);
    var isBest = list[0] && list[0].id === run.id && score > 0;

    ovRank.className = 'rank ' + rk.k;
    ovRank.textContent = rk.n;
    ovRankCn.textContent = rk.cn;
    ovTitle.textContent = isBest ? '这局结束 · 新纪录' : '这局结束';
    ovStats.innerHTML =
      '<div><span>得分</span><b>' + score + '</b></div>' +
      '<div><span>层数</span><b>' + level + '</b></div>' +
      '<div><span>最高</span><b>' + best + '</b></div>';
    renderRuns(list, run.id);
    ovBtn.textContent = '再来一局';
    overlay.classList.add('show');
    sfxOver();
    if (isBest) sfxBest();
    shake = 6;
  }

  // ---- 输入 ----

  function pointToPaddle(clientX) {
    var rect = stage.getBoundingClientRect();
    var ratio = (clientX - rect.left) / rect.width;
    paddleX = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, ratio * W));
  }

  stage.addEventListener('mousemove', function (e) {
    if (state !== 'playing' && state !== 'paused') return;
    pointToPaddle(e.clientX);
  });

  stage.addEventListener('touchstart', function (e) {
    if (state === 'ready' || state === 'over') return;
    if (e.touches.length) pointToPaddle(e.touches[0].clientX);
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (state !== 'playing' && state !== 'paused') return;
    if (e.touches.length) pointToPaddle(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePause(); return; }
    if (e.key === 'r' || e.key === 'R') { startCd(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); keys.left = true; }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); keys.right = true; }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') && state === 'ready') {
      startCd();
    }
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  ovBtn.addEventListener('click', function () {
    if (state === 'paused') { togglePause(); return; }
    startCd();
  });
  pauseBtn.addEventListener('click', function () {
    if (state === 'ready' || state === 'over') { startCd(); return; }
    togglePause();
  });
  restartBtn.addEventListener('click', startCd);
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    renderSoundBtn();
    try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
    if (soundOn) tone(720, 0.1, 'triangle', 0.06);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });

  window.addEventListener('resize', fit);

  fit();
  reset();

  // 只读验收探针：只在 ?dbg=1 时存在，不影响对局、不上报任何数
  if (/[?&]dbg=1/.test(location.search)) {
    window.__probe = function () {
      return { score: score, level: level, lives: lives, chain: chain, mult: mult, state: state, alive: bricks.filter(function (b) { return b.alive; }).length };
    };
  }

  rafId = requestAnimationFrame(loop);
})();
</script>
